# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                Server Options                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g default-terminal "tmux-256color"                    # Set default terminal type
set -as terminal-features ",*:RGB"                         # Apply if tmux loses truecolor
set -g escape-time 0                                       # Set escape key timeout
set -g extended-keys on                                    # Enable extended key reporting
set -g extended-keys-format csi-u                          # Set modified key format (CSI-U)
set -g focus-events on                                     # Enable terminal focus events
set -g history-file "$XDG_STATE_HOME/history/.tmux_history"     # Set tmux history file path
set -g prompt-history-limit 1000                           # Limit prompt history entries
set -g set-clipboard on                                    # Enable terminal clipboard integration

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃               Session Options                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# set -g activity-action current                             # Activity notification behavior ----- Deciding still

set -g assume-paste-time 10                                # Detect pasted input bursts
set -g base-index 1                                        # Starting window numbering index
set -g default-shell /bin/zsh                              # Specify the default shell
set -g display-panes-time 2000                             # Pane number overlay duration
set -g display-time 2000                                   # Message display duration
# set -g history-limit 100000                                # Scrollback history limit

# set -g menu-style                                          # Menu appearance
# set -g menu-selected-style                                 # Selected menu item appearance
# set -g menu-border-style                                   # Menu border appearance
# set -g menu-border-lines                                   # Menu border characters
# set -g message-command-style                               # Command prompt message style
# set -g message-format                                      # Message area layout format
# set -g message-line                                        # Message display line
# set -g message-style                                       # Message appearance

set -g mouse on                                            # Enable mouse support
set -g prefix C-a                                          # Primary prefix key
set -g prefix2 none                                        # Secondary prefix key

# set -g prompt-cursor-colour                                 # Prompt cursor color
# set -g prompt-cursor-style                                  # Prompt cursor appearance
# set -g prompt-command-cursor-style                          # Vi command-mode cursor style

set -g renumber-windows on                                 # Auto-renumber windows
set -g repeat-time 750                                     # Repeatable key timeout

set -g status-interval 3                                   # Status refresh interval
set -g status-position bottom                              # Status bar position

# set -g visual-activity off                                 # Visual activity notifications ----- Deciding still

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                Window Options                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g automatic-rename on                                 # Auto-rename windows
# set -g automatic-rename-format                             # Window rename format

set -g clock-mode-style 12                                 # Clock time format

set -g mode-keys vi                                        # Copy mode keybindings

# set -g monitor-activity on                                 # Highlight window activity ----- Deciding still
# set -g monitor-bell off                                    # Highlight window bell ----- Deciding still
# set -g monitor-silence 0                                   # Highlight silent windows ----- Deciding still

set -g pane-base-index 1                                   # Starting pane number

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                 Pane Options                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g allow-passthrough on                                # Enable OSC52 and terminal integrations

# set -g remain-on-exit                                      # Keep pane after exit
# set -g remain-on-exit-format                               # Exited pane status text

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃              Configuration Hint              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Use: tmux show -gw | less

# https://www.man7.org/linux/man-pages/man1/tmux.1.html#OPTIONS
# -s -- show server options (tmux process itself)
# -g -- show global options (session)
# -w -- show window options (not session)
# -p -- show pane options (not session)
# -a -- append instead of replace
# -u --  unset and inherit/default

# Server (tmux process itself)
# └── Sessions (per session)
#     └── Windows (per window)
#         └── Panes (per pane)

# https://www.man7.org/linux/man-pages/man1/tmux.1.html#OPTIONS
