# Core tmux behavior and global settings
source-file ~/.config/tmux/options.conf          # set/setw options (behavior, defaults)

# Keybindings and user interaction
source-file ~/.config/tmux/keybinds.conf         # bind/unbind keys, shortcuts, prefix logic

# Plugin management (TPM or other plugin setup)
source-file ~/.config/tmux/plugins.conf          # plugin list and plugin configuration

# UI / visual styling (status bar, colors, window look)
source-file ~/.config/tmux/themes/default.conf   # theme, status bar, colors, UI tweaks
