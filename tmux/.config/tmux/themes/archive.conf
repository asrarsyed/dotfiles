# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃               Session Options                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g status-format[]                                     # Custom status line format
set -g status-justify                                      # Window list alignment
set -g status-left                                         # Left status content
set -g status-left-length                                  # Left status maximum width
set -g status-left-style                                   # Left status appearance
set -g status-right                                        # Right status content
set -g status-right-length                                 # Right status maximum width
set -g status-right-style                                  # Right status appearance
set -g status-style                                        # Overall status appearance

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                Window Options                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g clock-mode-colour                                   # Clock display color

set -g fill-character                                      # Fill unused terminal space

set -g copy-mode-match-style                               # Search match style
set -g copy-mode-mark-style                                # Marked line style
set -g copy-mode-current-match-style                       # Current match style
set -g copy-mode-position-format                           # Position indicator format
set -g copy-mode-position-style                            # Position indicator style
set -g copy-mode-selection-style                           # Selection highlight style
set -g copy-mode-current-line-number-style                 # Current line number style
set -g copy-mode-line-number-style                         # Line number style
set -g copy-mode-line-numbers                              # Copy mode line numbers

set -g mode-style                                          # Mode appearance

set -g pane-active-border-style                            # Active pane border style
set -g pane-border-format                                  # Pane border text
set -g pane-border-indicators                              # Active pane indicators
set -g pane-border-lines                                   # Pane border characters
set -g pane-border-status                                  # Pane border status position
set -g pane-border-style                                   # Inactive pane border style

set -g popup-style                                         # Popup appearance
set -g popup-border-style                                  # Popup border style
set -g popup-border-lines                                  # Popup border characters

set -g pane-status-current-style                           # Active pane status style
set -g pane-status-style                                   # Pane status style

set -g session-status-current-style                        # Active session style
set -g session-status-style                                # Session status style

set -g tree-mode-preview-format                            # Tree preview format
set -g tree-mode-preview-style                             # Tree preview style

set -g window-status-current-format                        # Active window format
set -g window-status-current-style                         # Active window style
set -g window-status-format                                # Window list format
set -g window-status-last-style                            # Last window style
set -g window-status-separator                             # Window list separator
set -g window-status-style                                 # Window status style

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                 Pane Options                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

set -g cursor-colour                                       # Set cursor color
set -g cursor-style                                        # Set cursor appearance

set -g pane-colours[]                                      # Define pane color palette

set -g window-active-style                                 # Style active pane
set -g window-style                                        # Style inactive panes