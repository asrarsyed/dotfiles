# ┃     TMUX Plugin Manager + Auto-Installer     ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Set plugin install location (XDG data dir, outside of dotfiles)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# Bootstrap TPM and install plugins on first setup if missing (creates parent dirs if needed)
if-shell -b 'test ! -d $HOME/.local/share/tmux/plugins/tpm' \
  'run-shell -b "mkdir -p $HOME/.local/share/tmux/plugins && git clone https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins"'

# Initializes TPM (must be last line)
run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"